<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PortGuard — by DronePort Rotterdam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  :root {
    --bg: #060d1e;
    --bg-2: #0a1530;
    --bg-elev: #0e1a38;
    --bg-card: #0d1838;
    --line: #1a2a52;
    --line-bright: #243a6b;
    --ink: #ffffff;
    --ink-dim: #94a3c4;
    --ink-faint: #5a6788;
    --brand: #3b82f6;
    --brand-2: #38bdf8;
    --port: #003DA5;
    --port-light: #3b82f6;
    --douane: #0EA5E9;
    --politie: #F97316;
    --governor: #a78bfa;
  }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(to right, rgba(59,130,246,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(59,130,246,0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 90% 50% at 50% -10%, rgba(56,189,248,0.12), transparent 60%),
      radial-gradient(ellipse 60% 40% at 0% 100%, rgba(59,130,246,0.08), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .wordmark-port { color: #ffffff; }
  .wordmark-g {
    background: linear-gradient(180deg, #5eead4 0%, #22d3ee 40%, #0ea5e9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .wordmark-uard {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 60%, #1e3a8a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .wordmark {
    font-weight: 800;
    letter-spacing: -0.04em;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    background: rgba(14, 26, 56, 0.6);
    border-radius: 999px;
    font-size: 12px;
    color: #7dd3fc;
    backdrop-filter: blur(8px);
  }
  .pill-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .persona-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .persona-card::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--persona-glow);
    opacity: 0.6;
    pointer-events: none;
  }
  .persona-card > * { position: relative; z-index: 1; }
  .persona-card:hover {
    transform: translateY(-3px);
    border-color: var(--persona-color);
    box-shadow: 0 20px 50px -20px var(--persona-shadow);
  }

  .persona-port {
    --persona-color: #003DA5;
    --persona-glow: radial-gradient(ellipse at top left, rgba(0,61,165,0.25), transparent 60%);
    --persona-shadow: rgba(0,61,165,0.5);
  }
  .persona-douane {
    --persona-color: #0EA5E9;
    --persona-glow: radial-gradient(ellipse at top left, rgba(14,165,233,0.2), transparent 60%);
    --persona-shadow: rgba(14,165,233,0.4);
  }
  .persona-politie {
    --persona-color: #F97316;
    --persona-glow: radial-gradient(ellipse at top left, rgba(249,115,22,0.2), transparent 60%);
    --persona-shadow: rgba(249,115,22,0.4);
  }
  .persona-governor {
    --persona-color: #a78bfa;
    --persona-glow: radial-gradient(ellipse at top left, rgba(167,139,250,0.2), transparent 60%);
    --persona-shadow: rgba(167,139,250,0.4);
  }

  .badge-role {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .badge-provider { background: rgba(0,61,165,0.2); color: #93c5fd; border: 1px solid rgba(0,61,165,0.4); }
  .badge-consumer-douane { background: rgba(14,165,233,0.15); color: #7dd3fc; border: 1px solid rgba(14,165,233,0.4); }
  .badge-consumer-politie { background: rgba(249,115,22,0.15); color: #fdba74; border: 1px solid rgba(249,115,22,0.4); }
  .badge-governor { background: rgba(167,139,250,0.15); color: #c4b5fd; border: 1px solid rgba(167,139,250,0.4); }

  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    font-weight: 600;
    border: 1px solid #3b82f6;
    box-shadow: 0 8px 24px -8px rgba(59,130,246,0.5);
    transition: all 0.2s ease;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px -8px rgba(59,130,246,0.7);
  }
  .btn-ghost {
    background: rgba(14,26,56,0.5);
    border: 1px solid var(--line-bright);
    color: var(--ink-dim);
    transition: all 0.2s ease;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--brand); }

  .arch-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .arch-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .arch-card:hover::before, .arch-card.expanded::before { opacity: 0.7; }
  .arch-card:hover, .arch-card.expanded {
    border-color: var(--accent, var(--line-bright));
    transform: translateY(-2px);
    box-shadow: 0 24px 50px -24px var(--accent-glow);
  }

  .node {
    background: rgba(20, 40, 80, 0.4);
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: all 0.25s ease;
  }
  .node:hover {
    border-color: var(--accent);
    background: rgba(20, 40, 80, 0.7);
  }

  .video-frame {
    background: #000;
    border: 1px solid var(--line);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }
  .video-frame video { display: block; width: 100%; height: 100%; }
  .video-corner {
    position: absolute;
    width: 14px; height: 14px;
    border: 1.5px solid #38bdf8;
    pointer-events: none;
  }
  .video-corner.tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
  .video-corner.tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
  .video-corner.bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; }
  .video-corner.br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }
  .rec-badge {
    position: absolute; top: 14px; left: 32px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #fff;
  }
  .rec-badge::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: #ef4444;
    animation: pulse 1.5s infinite;
  }

  .reveal { opacity: 0; transform: translateY(12px); animation: reveal 0.6s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes reveal { to { opacity: 1; transform: none; } }

  .flow-line { stroke-dasharray: 5 5; animation: dash 25s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -200; } }

  .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 3px; }

  .logo-pg {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #3b82f6, #1e40af);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: -0.02em;
    color: white;
    box-shadow: 0 4px 12px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .mode-btn {
    transition: all 0.25s ease;
    position: relative;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(56,189,248,0.1));
    border-color: var(--brand-2);
    color: white;
  }
  .mode-btn.active .mode-dot {
    background: var(--brand-2);
    box-shadow: 0 0 12px var(--brand-2);
  }

  /* Pull quote */
  .pull-quote {
    border-left: 3px solid var(--brand-2);
    padding: 16px 20px;
    background: linear-gradient(90deg, rgba(56,189,248,0.06), transparent);
    font-size: 1.05rem;
    font-style: italic;
    color: #cbd5e1;
  }

  /* Matrix table */
  .matrix {
    border-collapse: collapse;
    width: 100%;
  }
  .matrix th, .matrix td {
    border: 1px solid var(--line);
    padding: 10px 14px;
    text-align: left;
    font-size: 13px;
  }
  .matrix th {
    background: var(--bg-elev);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    font-weight: 600;
  }
  .matrix td.check { color: #6ee7b7; text-align: center; }
  .matrix td.cross { color: #fca5a5; text-align: center; }
  .matrix td.tool { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7dd3fc; }

  /* Capability card (for promo highlights) */
  .cap-card {
    background: linear-gradient(180deg, var(--bg-card), rgba(13,24,56,0.5));
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .cap-card:hover {
    transform: translateY(-2px);
    border-color: var(--cap-color, var(--brand));
    box-shadow: 0 16px 40px -16px var(--cap-shadow, rgba(59,130,246,0.4));
  }
  .cap-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--cap-color, var(--brand));
    letter-spacing: 0.15em;
  }

  /* Persona tab buttons (Same map. Three truths.) */
  .persona-tab {
    position: relative;
    padding: 12px 0;
    margin-right: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-dim);
    transition: color 0.2s ease;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .persona-tab.active { color: white; }
  .persona-tab::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--tab-color, #38bdf8);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s cubic-bezier(.2,.7,.2,1);
  }
  .persona-tab.active::after { transform: scaleX(1); }

  /* Granted / Denied panels */
  .panel-granted {
    border: 1px solid var(--panel-color, #38bdf8);
    background: linear-gradient(135deg, var(--bg-card), color-mix(in srgb, var(--panel-color, #38bdf8) 8%, transparent));
    border-radius: 12px;
    padding: 28px;
  }
  .panel-denied {
    border: 1px solid var(--line);
    background: rgba(13, 24, 56, 0.3);
    border-radius: 12px;
    padding: 28px;
  }
  .denied-item {
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    color: var(--ink-faint);
  }

  /* Step pills for the lifecycle */
  .step-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 22px;
    min-width: 170px;
    transition: all 0.25s ease;
    position: relative;
  }
  .step-card:hover {
    border-color: var(--step-color, var(--brand-2));
    transform: translateY(-2px);
    box-shadow: 0 12px 30px -10px color-mix(in srgb, var(--step-color, var(--brand-2)) 40%, transparent);
  }
  .step-arrow {
    display: flex;
    align-items: center;
    color: var(--brand-2);
    opacity: 0.5;
  }

  /* AI vendor chip */
  .vendor-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--chip-color, var(--line-bright));
    background: color-mix(in srgb, var(--chip-color, var(--brand)) 10%, transparent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--chip-color, white);
    transition: all 0.2s ease;
  }
  .vendor-chip:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--chip-color, var(--brand)) 40%, transparent);
  }
  .vendor-chip-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--chip-color, var(--brand));
    box-shadow: 0 0 8px var(--chip-color, var(--brand));
  }
</style>
</head>

function downloadHTML() {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'portguard-blueprint.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

                ))}
              </div>
            </div>
          </div>
        </div>

        <div className="mt-10 pull-quote">
          "{t('ai.agnostic.note')}"
        </div>
      </div>
    </section>
  );
}

function StatusSection() {
  const { t } = useT();
  const live = t('status.live');
  const pending = t('status.pending');
  return (
    <section className="relative border-t border-[var(--line)] py-20">
      <div className="max-w-[1400px] mx-auto px-6 lg:px-10">
        <SectionHeader num="09" label="Status" title={t('status.title')} />

        <div className="mt-10 grid grid-cols-1 md:grid-cols-2 gap-5">
          <div className="cap-card" style={{ '--cap-color': '#6ee7b7' }}>
            <div className="flex items-center gap-2 mb-4">
              <span className="w-2 h-2 rounded-full bg-[#6ee7b7]" style={{ boxShadow: '0 0 10px #6ee7b7' }} />
              <div className="font-mono text-xs uppercase tracking-[0.18em] text-[#6ee7b7]">{t('status.live.title')}</div>
            </div>
            <ul className="space-y-2">
              {Array.isArray(live) && live.map((pt, j) => (
                <li key={j} className="flex items-start gap-2 text-sm text-[var(--ink-dim)] leading-relaxed">
                  <span className="text-[#6ee7b7] mt-0.5">✓</span><span>{pt}</span>
                </li>
              ))}
            </ul>
          </div>
          <div className="cap-card" style={{ '--cap-color': '#fcd34d' }}>
            <div className="flex items-center gap-2 mb-4">
              <span className="w-2 h-2 rounded-full bg-[#fcd34d]" />
              <div className="font-mono text-xs uppercase tracking-[0.18em] text-[#fcd34d]">{t('status.pending.title')}</div>
            </div>
            <ul className="space-y-2">
              {Array.isArray(pending) && pending.map((pt, j) => (
                <li key={j} className="flex items-start gap-2 text-sm text-[var(--ink-dim)] leading-relaxed">
                  <span className="text-[#fcd34d] mt-0.5">○</span><span>{pt}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      </div>
    </section>
  );
}

function Closing() {
  const { t } = useT();
  return (
    <section className="relative border-t border-[var(--line)] py-24">
      <div className="max-w-[900px] mx-auto px-6 lg:px-10 text-center">
        <div className="font-mono text-xs uppercase tracking-[0.25em] text-[#7dd3fc] mb-4">// CLOSING</div>
        <h2 className="text-4xl md:text-5xl font-bold leading-tight mb-6">{t('closing.title')}</h2>
        <p className="text-lg text-[var(--ink-dim)] leading-relaxed">{t('closing.text')}</p>
        <div className="mt-10 pull-quote inline-block text-left max-w-xl">
          "{t('hero.principle')}"
        </div>
      </div>
    </section>
  );
}

function Footer({ onChangeMode }) {
  const { t } = useT();
  return (
    <footer className="border-t border-[var(--line)] py-10">
      <div className="max-w-[1400px] mx-auto px-6 lg:px-10 flex flex-wrap items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <div className="logo-pg" style={{ width: 28, height: 28, fontSize: 11 }}>PG</div>
          <div>
            <div className="font-bold text-sm">PortGuard</div>
            <div className="text-xs text-[var(--ink-faint)]">{t('app.tagline')}</div>
          </div>
        </div>
        <div className="text-xs text-[var(--ink-faint)] text-center">
          {t('partners.footer')}
        </div>
        <div className="flex gap-2">
          <button onClick={onChangeMode} className="btn-ghost px-3 py-2 rounded-lg text-xs font-mono uppercase tracking-wider">
            {t('common.changemode')}
          </button>
          <button onClick={downloadHTML} className="btn-primary px-4 py-2 rounded-lg text-xs font-semibold">
            ↓ Download HTML
          </button>
        </div>
      </div>
    </footer>
  );
}

// =============== APP ===============
function App() {
  const [lang, setLang] = useState('en');
  const [mode, setMode] = useState(null); // null = picker, 'promo' | 'demo' | 'quick'

  const t = (key) => {
    const val = I18N[lang][key];
    return val !== undefined ? val : key;
  };

  const handleNav = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  const handleChangeMode = () => {
    setMode(null);
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 50);
  };

  return (
    <LangContext.Provider value={{ lang, t }}>
      {mode === null ? (
        <>
          <header className="border-b border-[var(--line)] bg-[var(--bg)]/85 backdrop-blur-md sticky top-0 z-30">
            <div className="max-w-[1400px] mx-auto px-6 lg:px-10 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="logo-pg">PG</div>
                <div>
                  <div className="font-bold text-lg leading-none tracking-tight">PortGuard</div>
                  <div className="text-xs text-[var(--ink-dim)] mt-1">{t('app.tagline')}</div>
                </div>
              </div>
              <div className="flex items-center gap-1 px-3 py-1.5 rounded-md border border-[var(--line-bright)] text-xs font-mono">
                <button onClick={() => setLang('en')} className={`px-1 ${lang === 'en' ? 'text-white' : 'text-[var(--ink-faint)]'}`}>EN</button>
                <span className="text-[var(--ink-faint)]">|</span>
                <button onClick={() => setLang('nl')} className={`px-1 ${lang === 'nl' ? 'text-white' : 'text-[var(--ink-faint)]'}`}>NL</button>
              </div>
            </div>
          </header>
          <ModeSelector onSelect={setMode} />
        </>
      ) : (
        <>
          <Header mode={mode} onChangeMode={handleChangeMode} lang={lang} setLang={setLang} onNav={handleNav} />
          <Hero />
          {/* PROMO MODE */}
          {mode === 'promo' && (
            <>
              <Capabilities id="capabilities" />
              <DemoSection id="demo" />
              <ThreeTruthsSection id="truths" />
              <ValueSection id="value" />
            </>
          )}
          {/* QUICK MODE */}
          {mode === 'quick' && (
            <>
              <Capabilities id="capabilities" />
              <DemoSection id="demo" quick />
              <ThreeTruthsSection id="truths" />
              <ArchitectureSection id="architecture" />
              <AIAgnosticSection id="ai-agnostic" />
            </>
          )}
          {/* FULL DEMO MODE */}
          {mode === 'demo' && (
            <>
              <Capabilities id="capabilities" />
              <DemoSection id="demo" />
              <PersonasSection id="personas" />
              <ThreeTruthsSection id="truths" />
              <IdentitySection id="identity" />
              <LifecycleSection id="lifecycle" />
              <ArchitectureSection id="architecture" />
              <AIAgnosticSection id="ai-agnostic" />
              <UseCasesSection id="usecases" />
              <RolesSection id="roles" />
              <ValueSection id="value" />
              <StatusSection />
            </>
          )}
          <Closing />
          <Footer onChangeMode={handleChangeMode} />
        </>
      )}
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
